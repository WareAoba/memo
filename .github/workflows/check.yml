name: Check
on:
  push:
  pull_request:

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Select documentation comparison base
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$EVENT_BASE"
          if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]]; then
            first=$(git log --reverse --format=%H -- scripts/change-policy.mjs | head -n 1)
            base=$(git rev-parse "${first}^" 2>/dev/null) || base=$(git hash-object -t tree --stdin </dev/null)
          fi
          echo "DOCS_BASE=$base" >> "$GITHUB_ENV"
      - run: npm run test:harness
      - run: npm run check:docs

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94"
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path backend/Cargo.toml --check
      - run: cargo clippy --manifest-path backend/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path backend/Cargo.toml --locked
      - run: cargo build --manifest-path backend/Cargo.toml --locked

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm run check:docs
      - run: npm run check:frontend
