name: preset-execution
services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      BIND_ADDRESS: 0.0.0.0:3000
      DATABASE_PATH: /data/database/app.sqlite3
      PHOTO_DIR: /data/photos
      PUSH_ENABLED: ${PUSH_ENABLED:-true}
      VAPID_KEY_PATH: /data/push/vapid.key
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.invalid}
      RUST_LOG: ${RUST_LOG:-info}
      APP_ORIGINS: http://localhost:${APP_PORT:-8080},http://127.0.0.1:${APP_PORT:-8080},http://[::1]:${APP_PORT:-8080},http://127.0.0.1:3000,http://127.0.0.1
    volumes:
      - ${DATA_VOLUME:-app-data}:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    environment:
      API_PROXY_TARGET: http://backend:3000
    volumes:
      - ./frontend/src:/app/src:ro
      - ./frontend/public:/app/public:ro
      - ./frontend/index.html:/app/index.html:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:15173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  app-data:
